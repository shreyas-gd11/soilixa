<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - Soilixa</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container section-pad">
    <h1>Checkout</h1>
    <form id="checkoutForm" class="checkout-form">
      <div>
        <label for="checkoutName">Name*</label>
        <input id="checkoutName" name="farmerName" required>
      </div>
      <div>
        <label for="checkoutPhone">Phone*</label>
        <input id="checkoutPhone" name="mobileNumber" type="tel" inputmode="numeric" pattern="[6-9][0-9]{9}" minlength="10" maxlength="10" required>
      </div>
      <div>
        <label for="checkoutVillage">Village</label>
        <input id="checkoutVillage" name="village" required>
      </div>
      <div>
        <label for="checkoutTaluk">Taluk</label>
        <input id="checkoutTaluk" name="taluk" required>
      </div>
      <div>
        <label for="checkoutDistrict">District</label>
        <input id="checkoutDistrict" name="district" required>
      </div>
      <div>
        <label for="checkoutPin">PIN Code</label>
        <input id="checkoutPin" name="pinCode" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
      </div>
      <div>
        <label for="checkoutAddress">Address*</label>
        <textarea id="checkoutAddress" name="deliveryAddress" required></textarea>
      </div>
      <div id="checkoutSummary"></div>
      <label class="consent-control"><input type="checkbox" name="privacy_consent" required> I agree to the <a href="privacy.html" target="_blank">Privacy Policy</a> and allow Soilixa to contact me by call/WhatsApp about my request.</label>
      <input type="hidden" name="consent_policy_version" value="2026-11-07-v1">
      <input type="hidden" name="consent_timestamp" value="">
      <div class="manual-payment-card hidden" id="manualPaymentCard" aria-live="polite"></div>
      <div id="checkoutStatus" class="form-status"></div>
      <button type="submit" class="btn-primary">Place Order</button>
    </form>
  </main>
  <footer class="site-footer"><div class="container footer-wrap"><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms</a><a href="refund-shipping.html">Refund &amp; Shipping</a></div></footer>

  <script src="js/config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
